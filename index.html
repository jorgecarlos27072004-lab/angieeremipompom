<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazones para Angie</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        header {
            text-align: center;
            margin-top: 25px;
            color: #d63384;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            animation: pulseHeader 2s infinite ease-in-out;
        }

        @keyframes pulseHeader {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 95%;
            max-width: 1000px;
            margin: 20px auto;
            gap: 20px;
            position: relative;
        }

        /* Escena de Personajes con Cuerpo Completo */
        .character-card {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 200px;
            backdrop-filter: blur(5px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 2;
        }

        .character-name {
            font-size: 1.4rem;
            color: #880e4f;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Diseño de Muñecos con Cuerpos */
        .body-avatar {
            width: 140px;
            height: 180px;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Muñeco Jorge */
        .jorge-head {
            width: 70px;
            height: 70px;
            background-color: #ffd8b5;
            border-radius: 50%;
            position: relative;
            border: 3px solid #4a3525;
            z-index: 3;
        }
        .jorge-hair {
            position: absolute;
            top: -6px;
            left: -2px;
            width: 74px;
            height: 35px;
            background-color: #4a3525;
            border-radius: 40px 40px 0 0;
        }
        .jorge-body {
            width: 60px;
            height: 65px;
            background-color: #42a5f5;
            border-radius: 15px 15px 0 0;
            margin-top: -5px;
            position: relative;
            border: 3px solid #1e88e5;
        }
        .jorge-legs {
            width: 50px;
            height: 40px;
            display: flex;
            justify-content: space-between;
        }
        .jorge-leg {
            width: 18px;
            height: 40px;
            background-color: #1565c0;
            border-radius: 0 0 8px 8px;
        }

        /* Muñequita Angie */
        .angie-head {
            width: 70px;
            height: 70px;
            background-color: #ffe0bd;
            border-radius: 50%;
            position: relative;
            border: 3px solid #5c3a21;
            z-index: 3;
        }
        .angie-hair {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 86px;
            height: 80px;
            background-color: #5c3a21;
            border-radius: 40px 40px 20px 20px;
            z-index: -1;
        }
        .angie-body {
            width: 65px;
            height: 65px;
            background-color: #ff6090;
            border-radius: 20px 20px 0 0;
            margin-top: -5px;
            position: relative;
            border: 3px solid #e91e63;
        }
        .angie-legs {
            width: 45px;
            height: 40px;
            display: flex;
            justify-content: space-between;
        }
        .angie-leg {
            width: 16px;
            height: 40px;
            background-color: #ffe0bd;
            border-radius: 0 0 8px 8px;
        }

        /* Ojos y Boca */
        .face-eyes {
            display: flex;
            justify-content: space-around;
            width: 36px;
            margin: 25px auto 5px;
        }
        .eye {
            width: 7px;
            height: 7px;
            background-color: #222;
            border-radius: 50%;
        }
        .mouth {
            width: 12px;
            height: 6px;
            border-bottom: 3px solid #222;
            border-radius: 0 0 10px 10px;
            margin: 0 auto;
        }

        /* ANIMACIÓN DE ABRAZO Y BESO */
        .main-container.kissing .jorge-card {
            transform: translateX(180px) rotate(8deg);
            z-index: 5;
        }

        .main-container.kissing .angie-card {
            transform: translateX(-180px) rotate(-8deg);
            z-index: 5;
        }

        .kiss-heart {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 80px;
            opacity: 0;
            z-index: 100;
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .main-container.kissing .kiss-heart {
            transform: translate(-50%, -50%) scale(1.3);
            opacity: 1;
            animation: pulseKiss 0.8s infinite alternate;
        }

        @keyframes pulseKiss {
            0% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1.5); }
        }

        /* Panel Central Interactivo */
        .interactive-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.2);
            text-align: center;
            max-width: 380px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .counter-box {
            font-size: 3rem;
            color: #e91e63;
            font-weight: bold;
            margin: 5px 0;
            transition: transform 0.15s ease-out;
        }

        .counter-pop {
            transform: scale(1.3);
        }

        .message-box {
            min-height: 65px;
            margin: 15px 0;
            padding: 10px;
            background-color: #fff0f5;
            border-radius: 15px;
            border: 2px dashed #ff69b4;
            color: #c2185b;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-love {
            background: linear-gradient(45deg, #ff4081, #ff80ab);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-love:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.6);
        }

        .btn-love:active {
            transform: scale(0.90);
        }

        /* Corazones Flotantes */
        .floating-heart {
            position: fixed;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 3s linear forwards;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.4) rotate(360deg); opacity: 0; }
        }

        /* Sticker */
        .celebration-sticker {
            position: absolute;
            width: 140px;
            top: -70px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .celebration-sticker.show {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            top: -95px;
        }

        .celebration-sticker img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 3px solid #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>¡Muchos Corazones! ❤️</h1>
        <p>Jorge le envía todo su cariño a Angie</p>
    </header>

    <div class="main-container" id="sceneContainer">
        <!-- Corazón gigante de beso -->
        <div class="kiss-heart">👩‍❤️‍💋‍👨💋</div>

        <!-- Muñeco Jorge con Cuerpo Completo -->
        <div class="character-card jorge-card">
            <div class="body-avatar">
                <div class="jorge-head">
                    <div class="jorge-hair"></div>
                    <div class="face-eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mouth"></div>
                </div>
                <div class="jorge-body"></div>
                <div class="jorge-legs">
                    <div class="jorge-leg"></div>
                    <div class="jorge-leg"></div>
                </div>
            </div>
            <div class="character-name">Jorge</div>
        </div>

        <!-- Panel Interactivo Central -->
        <div class="interactive-panel">
            <div class="celebration-sticker" id="celebrationSticker">
                <img src="image.png" alt="Sticker" id="stickerImage">
            </div>

            <h2>Corazones Enviados</h2>
            <div class="counter-box" id="heartCounter">0</div>
            
            <div class="message-box" id="specialMessage">¡Sigue presionando para ver mensajes! ✨</div>

            <button class="btn-love" onclick="sendHeart()">¡Enviar Corazón a Angie! 💖</button>
        </div>

        <!-- Muñequita Angie con Cuerpo Completo -->
        <div class="character-card angie-card">
            <div class="body-avatar">
                <div class="angie-head">
                    <div class="angie-hair"></div>
                    <div class="face-eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mouth"></div>
                </div>
                <div class="angie-body"></div>
                <div class="angie-legs">
                    <div class="angie-leg"></div>
                    <div class="angie-leg"></div>
                </div>
            </div>
            <div class="character-name">Angie</div>
        </div>
    </div>

    <script>
        let count = 0;

        const beautifulMessages = [
            "Eres el sol que ilumina mis días ☀️",
            "Cada corazón es un pedacito de mi amor por ti 💖",
            "Angie, eres la persona más dulce que conozco 🌸",
            "Eres el motivo de mis sonrisas 😊",
            "Me haces el Jorge más feliz del mundo 🥰",
            "Adoro todo de ti, Angie ✨"
        ];

        function sendHeart() {
            count++;
            
            const counterElement = document.getElementById('heartCounter');
            counterElement.innerText = count;
            counterElement.classList.add('counter-pop');
            setTimeout(() => counterElement.classList.remove('counter-pop'), 150);

            checkMessagesAndSticker();
            createHeart();
        }

        function checkMessagesAndSticker() {
            const messageElement = document.getElementById('specialMessage');

            // Abrazo y Beso cada 20 corazones
            if (count % 20 === 0 && count > 0) {
                triggerKiss();
            }

            // Mensajes según la cantidad de corazones
            if (count === 10) {
                messageElement.innerText = "bien hecho pompurrina";
                triggerSticker();
            } else if (count === 20) {
                messageElement.innerText = "Mu bien muchacha merece do bolita owo";
                triggerSticker();
            } else if (count === 30) {
                messageElement.innerText = "awww mi bb, yo tambien te amo mucho";
                triggerSticker();
            } else if (count === 40) {
                messageElement.innerText = "casemonos :3";
                triggerSticker();
            } else if (count % 10 === 0 && count > 40) {
                messageElement.innerText = `¡Increíble Angie! ¡Ya van ${count} corazones! ❤️`;
                triggerSticker();
            } else if (count % 5 === 0) {
                const randomIndex = Math.floor(Math.random() * beautifulMessages.length);
                messageElement.innerText = beautifulMessages[randomIndex];
            }
        }

        function triggerKiss() {
            const scene = document.getElementById('sceneContainer');
            scene.classList.add('kissing');

            // Crear lluvia intensa de corazones durante el beso
            for(let i = 0; i < 15; i++) {
                setTimeout(createHeart, i * 150);
            }

            // Volver a la posición normal después de 3.5 segundos
            setTimeout(() => {
                scene.classList.remove('kissing');
            }, 3500);
        }

        function triggerSticker() {
            const stickerElement = document.getElementById('celebrationSticker');
            stickerElement.classList.add('show');

            setTimeout(() => {
                stickerElement.classList.remove('show');
            }, 3000);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            const hearts = ['❤️', '💖', '💗', '💓', '💕', '💘', '💋'];
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            
            heart.style.left = Math.random() * 80 + 10 + 'vw';
            heart.style.bottom = '0px';
            
            const size = Math.random() * 20 + 20;
            heart.style.fontSize = size + 'px';

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 3000);
        }

        setInterval(() => {
            if (Math.random() > 0.5) {
                createHeart();
            }
        }, 1500);
    </script>
</body>
